name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: windows-latest
    env:
      GRADIO_ANALYTICS_ENABLED: "False"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements/app.txt -r requirements/dev.txt
      - run: python -m ruff check .
      - run: python -m pytest
